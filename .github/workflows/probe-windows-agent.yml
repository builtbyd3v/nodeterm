name: probe-windows-agent
on:
  push:
    branches: [probe/windows-ssh-agent-add]
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: versions and service
        run: |
          ssh -V
          Get-Service ssh-agent | Format-List *
          Set-Service ssh-agent -StartupType Manual
          Start-Service ssh-agent
          Get-Service ssh-agent
          node -v
          "--- ssh -G addkeystoagent spellings"
          foreach ($v in @('yes','no','confirm','ask','1h','confirm 30m')) { "Host foo`n AddKeysToAgent $v" | Out-File -Encoding ascii "$env:RUNNER_TEMP\cfg"; ssh -F "$env:RUNNER_TEMP\cfg" -G foo | Select-String addkeystoagent }
      - name: keys
        run: |
          $d = "$env:RUNNER_TEMP\k"; New-Item -ItemType Directory $d | Out-Null
          ssh-keygen -q -t ed25519 -N pw -f "$d\ed"
          ssh-keygen -q -t ecdsa -b 256 -N pw -f "$d\ec"
          ssh-keygen -q -t rsa -b 3072 -N pw -f "$d\rsa"
          ssh-keygen -q -t ed25519 -N '' -f "$d\plain"
          "check plain is unencrypted:"; ssh-keygen -y -P '' -f "$d\plain"; "exit=$LASTEXITCODE"
          Get-ChildItem $d
      - name: ssh-add -t (lifetime) and -c (confirm) with the stock client
        timeout-minutes: 3
        run: |
          $d = "$env:RUNNER_TEMP\k"
          ssh-add -t 5 "$d\plain"; "ssh-add -t exit=$LASTEXITCODE"
          ssh-add -l; "list exit=$LASTEXITCODE"
          ssh-add -c "$d\plain"; "ssh-add -c exit=$LASTEXITCODE"
          ssh-add -l
          ssh-add -D; "ssh-add -D exit=$LASTEXITCODE"
      - name: ssh-add plain, registry, service restart
        timeout-minutes: 3
        run: |
          $d = "$env:RUNNER_TEMP\k"
          ssh-add "$d\plain"; "ssh-add exit=$LASTEXITCODE"
          ssh-add -l
          "--- registry HKCU\Software\OpenSSH\Agent"
          reg query HKCU\Software\OpenSSH\Agent /s
          Restart-Service ssh-agent -Force
          "--- after Restart-Service"
          ssh-add -l
          Stop-Service ssh-agent -Force; Start-Sleep 2; Start-Service ssh-agent
          "--- after Stop+Start"
          ssh-add -l
          ssh-add -D
          "--- after ssh-add -D registry"
          reg query HKCU\Software\OpenSSH\Agent /s
      - name: install ssh2 for the encoder probe
        timeout-minutes: 5
        run: |
          $w = "$env:RUNNER_TEMP\p"; New-Item -ItemType Directory $w | Out-Null
          Copy-Item probe\probe.mjs $w; Copy-Item src\core\remote-ssh\native\agent-add.ts $w
          Set-Content "$w\package.json" '{"name":"p","version":"1.0.0","type":"module"}'
          npm install --prefix $w ssh2@1.17.0 --no-audit --no-fund --ignore-scripts
          "installed: $LASTEXITCODE"
      - name: encoder constrained
        timeout-minutes: 2
        run: |
          $w = "$env:RUNNER_TEMP\p"; $d = "$env:RUNNER_TEMP\k"; $a = '\\.\pipe\openssh-ssh-agent'
          node "$w\probe.mjs" $a constrained "$d\ed" "$d\ec" "$d\rsa"
          ssh-add -l
          exit 0
      - name: encoder plain + sign + restart + remove
        timeout-minutes: 2
        run: |
          $w = "$env:RUNNER_TEMP\p"; $d = "$env:RUNNER_TEMP\k"; $a = '\\.\pipe\openssh-ssh-agent'
          node "$w\probe.mjs" $a plain "$d\ed" "$d\ec" "$d\rsa"
          ssh-add -l
          reg query HKCU\Software\OpenSSH\Agent\Keys
          "hello" | Out-File -Encoding ascii "$w\msg"
          foreach ($k in @('ed','ec','rsa')) { Copy-Item "$d\$k.pub" "$w\x.pub" -Force; Remove-Item "$w\msg.sig" -ErrorAction SilentlyContinue; ssh-keygen -Y sign -f "$w\x.pub" -n file "$w\msg" 2>&1 | Out-Null; "$k sign via agent exit=$LASTEXITCODE" }
          Restart-Service ssh-agent -Force
          "=== after restart"
          ssh-add -l
          node "$w\probe.mjs" $a remove "$d\ed" "$d\ec" "$d\rsa"
          ssh-add -l
          reg query HKCU\Software\OpenSSH\Agent\Keys
          exit 0
